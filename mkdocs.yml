site_name: JBlockGlitch
site_description: A lightweight Paper plugin that prevents ghost items and block glitching in protected regions.
site_url: https://jruk8.github.io/JBlockGlitch/
repo_url: https://github.com/jruk8/JBlockGlitch
repo_name: GitHub

theme:
  variant: modern
  language: en
  custom_dir: overrides
  # No logo or favicon yet: brand art is still being prepared. Add
  # logo/favicon here plus extra.logo_light below once they exist;
  # overrides/partials/logo.html already renders both marks.
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Basics:
      - Commands: basics/commands.md
  - Configuration:
      - Overview: configuration.md
  - Advanced:
      - Permissions: advanced/permissions.md
      - Extending: advanced/extending.md

extra:
  discord_url: https://discord.com/invite/hkWmCVmWDC
  # No generator backlink in the footer (SEO: no third-party links).
  generator: false
