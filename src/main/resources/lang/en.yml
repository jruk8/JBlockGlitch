prefix: "<#a6a6a6>[<gradient:#DB6D77:#E08A8A><bold>J</bold>BlockGlitch</gradient>]</#a6a6a6> "
core:
  reloadSuccess: "\\n{prefix}{plain}Configuration reloaded in {hl}{time}ms{plain}."
  reloadFailure: "{prefix}{error}Reload failed in {time}ms. Check the console for details."
  reloadRestartRequired: "{prefix}{hl}Reload complete. {plain}Command label changes need a server restart."
  helpHeader: "\\n{prefix}{brand}JBlockGlitch {version} Help:"
  helpEntryFormat: "{brand}» {hl}{syntax}{plain}: {description}"
  helpNoMatch: "{prefix}{plain}No commands match that query."
  helpNoCommands: "{prefix}{plain}No commands are available for you."
  versionSuccess: "\\n{prefix}{brand}Version {hl}{version}\\n{brand}» {hl}Authors: {plain}{authors}\\n{brand}» {hl}Links: {modrinth}{plain} | {github}{plain} | {donate}"
  updateAvailable: "\\n{prefix}{hl}JBlockGlitch {latest}{brand} is available (running {hl}{current}{brand}).\\n{brand}» {hl}Update: {modrinth} {plain}| {github} {plain}| {discord}"
  noPermission: "{prefix}{error}You do not have the permission {hl}'{permission}'{error} to use this command."
  linkModrinth: "<click:open_url:'{url}'><hover:show_text:'<#5ae663>Open on Modrinth'><#5ae663>Modrinth</hover></click>"
  linkGithub: "<click:open_url:'{url}'><hover:show_text:'<#5a88e6>Open on GitHub'><#5a88e6>GitHub</hover></click>"
  linkDiscord: "<click:open_url:'{url}'><hover:show_text:'<#6258f2>Join the Discord'><#6258f2>Discord</hover></click>"
  linkDonate: "<click:open_url:'{url}'><hover:show_text:'<#ff5e5b>Support on Ko-fi'><#ff5e5b>Donate</hover></click>"
  versionComma: "<gray>,</gray>"
  versionAnd: "<gray>and</gray>"
config:
  header: "\\n{prefix}{brand}Current configuration:"
  entry: "{brand}» {hl}{key}{plain}: {value}"
  updated: "{prefix}{plain}Set {hl}{key}{plain} to {hl}{value}{plain}."
  unknownKey: "{prefix}{error}Unknown config key {hl}{key}{error}. Valid keys: {hl}{keys}{error}."
  invalidValue: "{prefix}{error}Invalid value {hl}{value}{error} for {hl}{key}{error}. Allowed: {hl}{allowed}{error}."
help:
  help: "Shows this help menu."
  version: "Shows the plugin version."
  reload: "Reloads the plugin configuration."
  config: "Views or changes settings in-game."
