# This file contains player-facing JBlockGlitch messages.
# Additional message sections can be added here as the plugin grows.
#
# {prefix} is replaced with the prefix below in every message.
# {brand-col} is replaced with the brand color below. Use it inside
# MiniMessage tags like <{brand-col}>.

prefix: "<dark_gray>[<{brand-col}>JBlockGlitch<dark_gray>] "
brand-color: "#5adbc8"

help-message:
  - "\n{prefix}<{brand-col}>JBlockGlitch commands:"
  - "\n{prefix}<gray>» <white>/jbg help <gray>- this help"
  - "\n{prefix}<gray>» <white>/jbg reload <gray>- reload config and messages"
  - "\n{prefix}<gray>» <white>/jbg config <gray>- view settings"
  - "\n{prefix}<gray>» <white>/jbg config <key> [value] <gray>- change a setting"

no-permission: "{prefix}<red>You do not have permission to use this command."
reload-success: "{prefix}<green>Configuration and messages reloaded."

# Placeholders: {key}, {value}, {keys}, {allowed}.
config-header: "{prefix}<{brand-col}>Current configuration:"
config-entry: "\n{prefix}<gray>» {key}<dark_gray>: <white>{value}"
config-updated: "{prefix}<green>Set <white>{key}<green> to <white>{value}<green>."
config-unknown-key: "{prefix}<red>Unknown config key '<white>{key}<red>'. Valid keys: <white>{keys}<red>."
config-invalid-value: "{prefix}<red>Invalid value '<white>{value}<red>' for <white>{key}<red>. Allowed: <white>{allowed}<red>."
config-usage: "{prefix}<gray>» <white>/jbg config [key] [value]"
