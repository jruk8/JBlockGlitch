# Controls how messages.yml values are interpreted.
# Supported values: minimessage, legacy
# Default: minimessage
text-format: minimessage

# Controls whether anonymous usage statistics are sent to bStats
# (https://bstats.org). Only aggregated, non-identifying data is sent.
# Set to false to opt out.
#
# Default: true
toggle-anonymous-statistics: true

# Sounds played with plugin messages. 'neutral' plays on info and success
# messages, 'angry' on errors and command usage. Names are vanilla sound
# keys (minecraft: namespace is assumed).
sounds:
  neutral:
    sound: block.chain.step
    volume: 0.9
    pitch: 1.2
  angry:
    sound: block.chain.break
    volume: 0.7
    pitch: 0.8

# Settings for configuring protected block placements validation.
# This matters for protection plugins like WorldGuard, GriefPrevention, and others.
protected-block:
  enabled: true

  # Controls how denied protected block placements are handled.
  #
  # 'medium' will rubber band the player to their position on the last tick.
  # This denies most protected block placements but may allow some to go through.
  # (for example, 1.5 block or even higher jumps are possible, albeit hard)
  #
  # 'strict' will teleport the player to the ground using advanced detection.
  #
  # Supported values: medium, strict
  # Default: strict
  mode: strict

# Settings for configuring ghost items and ghost blocks validation.
ghost-item:
  enabled: true

  # Controls how the plugin will attempt to fix ghost items generation.
  #
  # 'medium' will only listen for when well-known event patterns (e.g., F+Q
  # or hotbarscroll+drop) are happening in the same tick. This is the
  # recommended option.
  #
  # 'hard' will listen for all inventory manipulation events. This prevents
  # MC-277905, a creative-mode ghost item bug.
  #
  # 'brute-force' forces the client to resync the inventory on every tick.
  # This is more aggressive and is likely to cause lag.
  #
  # Supported values: medium, hard, brute-force
  # Default: medium
  mode: medium

  # Controls how often the plugin will force the client to resync the blocks
  # around the player (a 2x2x4 cube centered on the player).
  #
  # This prevents client side modifications that can bypass vanilla ghost
  # item generation, or ghost blocks that protected block detection may
  # sometimes miss.
  #
  # Only players who moved since the previous resync are processed, so
  # stationary players cost nothing.
  #
  # A value of -1 disables checking entirely. A value of 1 will likely prevent
  # almost everything, but may cause lag. Choose a value suitable for your
  # server's needs.
  #
  # Default: 5 ticks (4 times per second)
  resync-tick-interval: 5

# Settings for the update checker. It compares the running version against
# the latest GitHub release (https://github.com/jruk8/JBlockGlitch/releases)
# and notifies players with the jblockglitch.admin permission.
update-checker:
  # Master switch for update checking.
  #
  # Default: true
  enabled: true

  # Which release severities notify. A release only notifies when its
  # severity over the running version is enabled here.
  releases:
    # Default: true
    major: true

    # Default: true
    minor: true

    # Default: true
    hotfix: true