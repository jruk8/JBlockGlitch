name: ${name}
version: ${version}
main: ${main}
api-version: "${apiVersion}"
author: ${author}
description: ${description}
website: ${website}

commands:
  jblockglitch:
    description: JBlockGlitch main command
    usage: /jblockglitch <help|reload|config>
    aliases:
      - jbg
    permission: jblockglitch.help

permissions:
  jblockglitch.help:
    description: View JBlockGlitch documentation
    default: true
  jblockglitch.reload:
    description: Reload JBlockGlitch configuration and messages
    default: op
  jblockglitch.admin:
    description: Receive JBlockGlitch update notifications
    default: op
  jblockglitch.config:
    description: View or change JBlockGlitch settings in-game
    default: op
