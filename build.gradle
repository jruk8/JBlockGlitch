plugins {
    id 'com.github.jruk8.plugin-conventions' version 'v1.4.8'
}

// JBlockGlitch uses Paper's native Brigadier commands (LifecycleEvents.COMMANDS),
// so the Incendo Cloud command framework that plugin-conventions adds is
// excluded from every configuration: it never reaches the compile classpath
// nor the shadowed runtime jar.
configurations {
    all {
        exclude group: 'org.incendo'
        exclude group: 'io.leangen.geantyref'
    }
}

// Keep `build` output clean: MockBukkit's bootstrap agent trips a CDS
// sharing warning and sqlite-jdbc trips a native-access warning on JDK 25.
tasks.withType(Test) {
    jvmArgs('-Xshare:off', '--enable-native-access=ALL-UNNAMED')
}

// plugin-conventions only expands plugin.yml, but JBlockGlitch declares its
// metadata (including permissions) in paper-plugin.yml, so expand the same
// gradle.properties there.
tasks.named('processResources') {
    String paperApi = project.property('paperApiVersion')
    Map<String, Object> pluginProperties = [
            version    : project.version,
            name       : project.property('pluginName'),
            main       : project.property('pluginMain'),
            apiVersion : paperApi.split('\\.build\\.')[0],
            author     : project.property('pluginAuthor'),
            description: project.property('pluginDescription'),
            website    : project.property('pluginWebsite')
    ]
    inputs.properties(pluginProperties)
    filesMatching('paper-plugin.yml') {
        expand(pluginProperties)
    }
}
