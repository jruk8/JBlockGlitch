plugins {
    id 'java'
    id 'checkstyle'
    id("com.gradleup.shadow") version "9.3.1"
    id("pl.allegro.tech.build.axion-release") version "1.21.2"
}

group = project.property('pluginGroup')

scmVersion {
    tag {
        prefix = 'v'
        versionSeparator = ''
    }
    snapshotCreator { version, position ->
        // Swap 'GITHUB_RUN_NUMBER' for 'CI_PIPELINE_IID' (GitLab) or 'BUILD_NUMBER' (Jenkins)
        def ciBuild = System.getenv('GITHUB_RUN_NUMBER')

        // If it's null (e.g., you are building locally), fall back to nothing
        def suffix = ciBuild ?: ""

        // Return the exact string that replaces the default '-SNAPSHOT'.
        // Only append the period when a build number is present.
        // Use string concatenation (not GString interpolation) so the
        // return value is a java.lang.String, which axion-release requires.
        return suffix ? ("-SNAPSHOT." + suffix) : "-SNAPSHOT"
    }
}

// Critical: Set this *after* the scmVersion block.
// If you evaluate project.version before configuring the closure, Gradle will ignore your logic and you will be miserable.
project.version = scmVersion.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url = 'https://maven.enginehub.org/repo/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    implementation("org.bstats:bstats-bukkit:3.2.1")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.shadowJar {
    configurations = [project.configurations.runtimeClasspath]

    dependencies {
        include(dependency("org.bstats:bstats-bukkit:3.2.1"))
    }

    relocate("org.bstats", project.group.toString())

    archiveClassifier = ''
}

jar {
    enabled = false
}

test {
    useJUnitPlatform()
}

check {
    dependsOn 'checkstyleMain', 'checkstyleTest'
}

processResources {
    def pluginProperties = [
            version: project.version,
            name: pluginName,
            main: pluginMain,
            apiVersion: paperApiVersion.split('\\.build\\.')[0],
            author: pluginAuthor,
            description: pluginDescription,
            website: pluginWebsite
    ]
    inputs.properties(pluginProperties)
    filesMatching('plugin.yml') {
        expand(pluginProperties)
    }
}